<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f4f7f8">
  <title>Solicitud recibida | Jordan Works</title>
  <style>
    :root{--bg:#f4f7f8;--text:#17232d;--muted:#5c6c78;--teal:#007b80;--mint:#e4f1ef;--line:#dfe7ec}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
    .card{max-width:650px;width:100%;text-align:center;background:#fff;border:1px solid var(--line);border-radius:20px;padding:clamp(28px,7vw,58px);box-shadow:0 8px 24px rgba(20,42,54,.035)}
    .mark{display:grid;place-items:center;width:58px;height:58px;border-radius:50%;margin:0 auto 18px;background:var(--mint);color:var(--teal);font-size:2rem;font-weight:800}
    .eyebrow{color:var(--teal);font-weight:850;letter-spacing:.16em;text-transform:uppercase;font-size:.78rem}h1{font-size:clamp(2rem,6vw,3rem);line-height:1.1;letter-spacing:-.04em;margin:16px 0;color:#17232d}
    p{color:var(--muted);font-size:1rem;line-height:1.7;margin:0 auto;max-width:510px}a{display:inline-block;margin-top:25px;background:var(--teal);color:#fff;text-decoration:none;padding:14px 21px;border-radius:11px;font-weight:800}a:hover{background:#006c72}
  </style>
</head>
<body><main class="card"><div class="mark">✓</div><div class="eyebrow">Jordan Works · Valoración gratuita</div><h1>Solicitud recibida</h1><p>Gracias por confiar en Jordan Works. Hemos recibido tu solicitud de valoración gratuita. Revisaremos los datos del vehículo y nos pondremos en contacto contigo.</p><a href="../index.html">Volver a la web</a></main></body>
</html>
